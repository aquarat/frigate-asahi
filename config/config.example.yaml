version: 0.18-0
semantic_search:
  enabled: true
  model_size: large
face_recognition:
  enabled: true
  model_size: large
lpr:
  enabled: false
classification:
  bird:
    enabled: false

detectors:
  # Host-side ZMQ detector (systemd unit frigate-detector.service), same
  # protocol and code lineage as the Mac's Apple Silicon detector, but running
  # ONNX Runtime on the CPU for now. The Vulkan/OpenCL backend slots in here.
  host_zmq:
    type: zmq
    endpoint: tcp://host.docker.internal:5555

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/fox-person-cat-320.onnx
  labelmap_path: /config/model_cache/fox-person-cat-labelmap.txt
go2rtc:
  webrtc:
    candidates:
      - <nvr-ip>:8555   # this host's LAN IP (was the Mac's <mac-ip>)
  streams:
    cam1:
      - onvif://<onvif-user>:<onvif-password>@<camera-1-ip>:2020
      - ffmpeg:cam1#audio=opus
    cam2:
      - onvif://<onvif-user>:<onvif-password>@<camera-2-ip>:2020
      - ffmpeg:cam2#audio=opus
    cam3:
      - onvif://<onvif-user>:<onvif-password>@<camera-3-ip>:2020
      - ffmpeg:cam3#audio=opus
    cam4:
      - onvif://<onvif-user>:<onvif-password>@<camera-4-ip>:2020
      - ffmpeg:cam4#audio=opus
    cam5:
      - onvif://<onvif-user>:<onvif-password>@<camera-5-ip>:2020
      - ffmpeg:cam5#audio=opus
